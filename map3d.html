  if(o.name==='Севастополь')return;
  const ring=o.rings.reduce((a,b)=>b.length>a.length?b:a,o.rings[0]); const [cx,cy]=centroid(ring);
  const OFF={'Київська':[5.5,-8.5],'Севастополь':[0,0]}; const off=OFF[o.name]||[0,0];
  const it=items.find(x=>x.oblast===o); const L=makeLabel(o,it); L.cx=cx+off[0]; L.cy=cy+off[1]; if(o.name==='Київ')L.sp.renderOrder=12; labels.push(L);
});
// ---- auto de-overlap of labels: screen-space at the final camera pose (16:9), unprojected back to the map ----
(function relax(){
  const cam=new THREE.PerspectiveCamera(36,16/9,0.1,800);
  const s=12, ang=-0.35+s*0.05, rad=118-12, elev=71-8;
  cam.position.set(Math.sin(ang)*rad,elev,Math.cos(ang)*rad); cam.lookAt(0,2,-2); cam.updateMatrixWorld(); cam.updateProjectionMatrix();
  const W=1920,H=1080, PAD=10, MAXPX=140;
  const toScr=(x,y,z)=>{const v=new THREE.Vector3(x,y,z).project(cam);return [(v.x+1)/2*W,(1-v.y)/2*H];};
  const items=labels.map(L=>{const y=(L.o.occ?0.9:1.6)+1.5; const [sx,sy]=toScr(L.cx,y,-L.cy);
    const [sx2]=toScr(L.cx+L.sp.scale.x/2,y,-L.cy); const hw=Math.abs(sx2-sx), hh=hw*L.sp.scale.y/L.sp.scale.x;
    return {L,y,x:sx,y0:sy,ox:sx,oy:sy,hw,hh};});
  for(let iter=0;iter<400;iter++){
    let moved=false;
    for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){
      const A=items[i],B=items[j]; const dx=B.x-A.x, dy=B.y0-A.y0;
      const ox=A.hw+B.hw+PAD-Math.abs(dx), oy=A.hh+B.hh+PAD-Math.abs(dy);
      if(ox>0&&oy>0){moved=true;
        if(oy<=ox){const m=(dy>=0?1:-1)*oy*0.5*0.7;A.y0-=m;B.y0+=m;}
        else{const m=(dx>=0?1:-1)*ox*0.5*0.7;A.x-=m;B.x+=m;}
      }
    }
    items.forEach(I=>{I.x+=(I.ox-I.x)*0.02;I.y0+=(I.oy-I.y0)*0.02;
      const ddx=I.x-I.ox,ddy=I.y0-I.oy,d=Math.hypot(ddx,ddy); if(d>MAXPX){I.x=I.ox+ddx/d*MAXPX;I.y0=I.oy+ddy/d*MAXPX;}});
    if(!moved)break;
  }
  // unproject moved screen points back onto the label plane y=I.y
  items.forEach(I=>{const ndc=new THREE.Vector3(I.x/W*2-1,1-I.y0/H*2,0.5).unproject(cam);
    const dir=ndc.sub(cam.position).normalize(); const t=(I.y-cam.position.y)/dir.y; const P=cam.position.clone().add(dir.multiplyScalar(t));
    I.L.cx=P.x; I.L.cy=-P.z;});
})();

// camera orbit
let t0=performance.now(), paused=false, pauseAt=0, offset=0;
const ONCE=/[?&]once=1/.test(location.search); const DUR=ONCE?1e12:17000;
const SEEK=(location.search.match(/[?&]t=([\d.]+)/)||[])[1]; if(SEEK){offset=-SEEK*1000;}
function ease(x){return x<0?0:x>1?1:1-Math.pow(1-x,3)}
function eio(x){x=x<0?0:x>1?1:x;return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
const numEl=document.getElementById('num'),lbl=document.getElementById('lbl'),pct=document.getElementById('pct'),phTx=document.getElementById('phaseTx'),phSm=document.getElementById('phaseSm'),ph=document.getElementById('phase');
function fmt(n){return Math.round(n).toLocaleString('uk-UA').replace(/,/g,' ')}
let lastPhase=-1;
function setPhase(p){if(p===lastPhase)return;lastPhase=p;
  if(p===0){phSm.textContent='Реєстр ДСНС';phTx.textContent='На папері';lbl.textContent='споруд у реєстрі';pct.style.opacity=0;}
  else{phSm.textContent='Насправді';phTx.textContent='Реальні укриття';lbl.textContent='реальних укриттів · капітальних, не підвали';pct.textContent=META.pct+'% реєстру';pct.style.opacity=1;}
}
function frame(now){
  requestAnimationFrame(frame);
  if(paused)return;
  const tm=(now-t0-offset)%DUR; const s=ONCE?Math.min(tm/1000,15.5):tm/1000;
  // phases: 0-2.6 rise | 2.6-6.5 hold paper | 6.5-9.5 rebuild | 9.5-16 hold real | 16-17 fade/reset
  const rise=ease(s/2.6);
  const rebuild=eio((s-6.5)/3.0);          // 0..1
  const paperAlive=1-rebuild;
  const cnt = s<6.5 ? META.total*ease(s/2.2) : META.total-(META.total-META.real)*rebuild;
  numEl.textContent=fmt(cnt);
  setPhase(s<6.5?0:1);
  const fade = s>16 ? 1-(s-16) : 1; document.body.style.opacity=Math.max(0,Math.min(1,fade*1.4));
  items.forEach(it=>{
    const hr=it.hs*rise; it.real.scale.y=Math.max(0.001,hr); it.ed.scale.y=Math.max(0.001,hr);
    if(it.paper){const hp=it.hp*rise*Math.max(0.001,paperAlive);
      it.paper.scale.y=Math.max(0.001,hp); it.paper.position.y=hr + rebuild*0.45; // drifts up as it dissolves
      it.ped.scale.y=Math.max(0.001,hp); it.ped.position.y=hr + rebuild*0.45;
      matPaper.opacity=.34*Math.pow(paperAlive,4.5); edgeMat.opacity=.6*Math.pow(paperAlive,2.5);}
  });

  const lblFade=ease((s-1.2)/1.4)*(s>16?Math.max(0,1-(s-16)):1);
  labels.forEach(L=>{
    const o=L.o, it=L.it; const val=o.occ?0:(s<6.5?o.n:o.n-(o.n-o.s)*rebuild);
    L.draw(val);
    const top=it?(it.hs*rise+(it.hp||0)*rise*Math.max(0.001,paperAlive)):0.3;
    L.sp.position.set(L.cx, top+(o.occ?0.9:1.6), -L.cy);
    L.mat.opacity=(o.occ?0.75:1)*lblFade;
  });

  // occupied zone: reveals with the truth
  const occA=ease((s-6.2)/2.2)*(s>16?Math.max(0,1-(s-16)):1);
  occGroup.position.y=1.5*rise+0.06;
  occGroup.userData.mat.opacity=0.95*occA; occGroup.userData.edge.opacity=0.9*occA;
  // camera: slow orbit, dolly in on rebuild
  const ang=-0.35 + s*0.05, rad=118 - 12*eio((s-6)/4), elev=71 - 8*eio((s-6)/4);
  camera.position.set(Math.sin(ang)*rad, elev, Math.cos(ang)*rad); camera.lookAt(0,2,-2);
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();if(!paused){paused=true;pauseAt=performance.now()}else{paused=false;offset+=performance.now()-pauseAt}}
  if(e.key==='r'||e.key==='R'){t0=performance.now();offset=0;lastPhase=-1;}});
})();
</script>
