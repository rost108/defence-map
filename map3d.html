    g.clearRect(0,0,cv.width,cv.height);
    const pw=cv.width-16,ph=cv.height-16; g.fillStyle='rgba(10,14,11,.78)'; roundRect(g,8,8,pw,ph,26); g.fill();
    g.strokeStyle=o.occ?'rgba(124,138,128,.5)':'rgba(196,237,46,.55)'; g.lineWidth=3; roundRect(g,8,8,pw,ph,26); g.stroke();
    g.textAlign='center'; g.textBaseline='middle';
    g.fillStyle=o.occ?'#9aa89f':'#dfe8dc'; g.font='500 40px "IBM Plex Mono", monospace'; g.letterSpacing='4px';
    g.fillText(name.toUpperCase(),cv.width/2,58);
    g.fillStyle=o.occ?'#7c8a80':'#C4ED2E'; g.font=(o.occ?'500 40px':'700 74px')+' "IBM Plex Mono", monospace'; g.letterSpacing=o.occ?'6px':'-2px';
    g.fillText(txt,cv.width/2,o.occ?118:122);
    tex.needsUpdate=true;
  }
  return {sp,mat,draw,o,it};
}
if(SHOW_LABELS) MAPDATA.forEach(o=>{
  if(o.name==='Севастополь')return;
  const ring=o.rings.reduce((a,b)=>b.length>a.length?b:a,o.rings[0]); const [cx,cy]=centroid(ring);
  const it=items.find(x=>x.oblast===o); const L=makeLabel(o,it); L.cx=cx; L.cy=cy; labels.push(L);
});

// camera orbit
let t0=performance.now(), paused=false, pauseAt=0, offset=0;
const ONCE=/[?&]once=1/.test(location.search); const DUR=ONCE?1e12:17000;
function ease(x){return x<0?0:x>1?1:1-Math.pow(1-x,3)}
function eio(x){x=x<0?0:x>1?1:x;return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
const numEl=document.getElementById('num'),lbl=document.getElementById('lbl'),pct=document.getElementById('pct'),phTx=document.getElementById('phaseTx'),phSm=document.getElementById('phaseSm'),ph=document.getElementById('phase');
function fmt(n){return Math.round(n).toLocaleString('uk-UA').replace(/,/g,' ')}
let lastPhase=-1;
function setPhase(p){if(p===lastPhase)return;lastPhase=p;
  if(p===0){phSm.textContent='Реєстр ДСНС';phTx.textContent='На папері';lbl.textContent='споруд у реєстрі';pct.style.opacity=0;}
  else{phSm.textContent='Насправді';phTx.textContent='Реальні укриття';lbl.textContent='реальних укриттів · капітальних, не підвали';pct.textContent=META.pct+'% реєстру';pct.style.opacity=1;}
}
function frame(now){
  requestAnimationFrame(frame);
  if(paused)return;
  const tm=(now-t0-offset)%DUR; const s=ONCE?Math.min(tm/1000,15.5):tm/1000;
  // phases: 0-2.6 rise | 2.6-6.5 hold paper | 6.5-9.5 rebuild | 9.5-16 hold real | 16-17 fade/reset
  const rise=ease(s/2.6);
  const rebuild=eio((s-6.5)/3.0);          // 0..1
  const paperAlive=1-rebuild;
  const cnt = s<6.5 ? META.total*ease(s/2.2) : META.total-(META.total-META.real)*rebuild;
  numEl.textContent=fmt(cnt);
  setPhase(s<6.5?0:1);
  const fade = s>16 ? 1-(s-16) : 1; document.body.style.opacity=Math.max(0,Math.min(1,fade*1.4));
  items.forEach(it=>{
    const hr=it.hs*rise; it.real.scale.y=Math.max(0.001,hr); it.ed.scale.y=Math.max(0.001,hr);
    if(it.paper){const hp=it.hp*rise*Math.max(0.001,paperAlive);
      it.paper.scale.y=Math.max(0.001,hp); it.paper.position.y=hr + rebuild*1.6; // drifts up as it dissolves
      it.ped.scale.y=Math.max(0.001,hp); it.ped.position.y=hr + rebuild*1.6;
      matPaper.opacity=.34*paperAlive; edgeMat.opacity=.35*(0.55+0.45*paperAlive);}
  });

  const lblFade=ease((s-1.2)/1.4)*(s>16?Math.max(0,1-(s-16)):1);
  labels.forEach(L=>{
    const o=L.o, it=L.it; const val=o.occ?0:(s<6.5?o.n:o.n-(o.n-o.s)*rebuild);
    L.draw(val);
    const top=it?(it.hs*rise+(it.hp||0)*rise*Math.max(0.001,paperAlive)):0.3;
    L.sp.position.set(L.cx, top+(o.occ?0.9:1.6), -L.cy);
    L.mat.opacity=(o.occ?0.75:1)*lblFade;
  });
  // camera: slow orbit, dolly in on rebuild
  const ang=-0.35 + s*0.05, rad=120 - 14*eio((s-6)/4), elev=62 - 10*eio((s-6)/4);
  camera.position.set(Math.sin(ang)*rad, elev, Math.cos(ang)*rad); camera.lookAt(0,2,-2);
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();if(!paused){paused=true;pauseAt=performance.now()}else{paused=false;offset+=performance.now()-pauseAt}}
  if(e.key==='r'||e.key==='R'){t0=performance.now();offset=0;lastPhase=-1;}});
})();
</script>
